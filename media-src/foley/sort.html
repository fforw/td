<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Foley sorting</title>
<style>
:root { --bg: #f6f3ec; --fg: #2a2620; --dim: #8a8070; --wave: #6b5f4a; --good: #3d8a4a; --bad: #b5483a; --sel: #e6dfcf; }
@media (prefers-color-scheme: dark) { :root { --bg: #1d1b18; --fg: #e8e2d6; --dim: #8f8778; --wave: #b3a68c; --good: #6cc27a; --bad: #e07767; --sel: #2f2c26; } }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; margin: 24px auto; max-width: 820px; padding: 0 16px; }
h2 { font-size: 15px; margin: 24px 0 8px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.row { display: grid; grid-template-columns: 9em 1fr 4em 7em; gap: 12px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.row.sel { background: var(--sel); }
.row canvas { width: 100%; height: 36px; }
.ms { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
.mark button { border: 1px solid var(--dim); background: none; color: var(--fg); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.row.good .g { background: var(--good); border-color: var(--good); color: #fff; }
.row.bad .b { background: var(--bad); border-color: var(--bad); color: #fff; }
.row.bad .name { text-decoration: line-through; color: var(--dim); }
p.help { color: var(--dim); }
textarea { width: 100%; height: 9em; background: var(--sel); color: var(--fg); border: 0; border-radius: 6px; padding: 8px; font: 12px monospace; box-sizing: border-box; }
</style></head><body>

let marks = {}
try { marks = JSON.parse(localStorage.getItem("foley-marks") || "{}") } catch (e) {}
let sel = 0
const audio = new Audio()
const list = document.getElementById("list")
const rows = []
let group = null
items.forEach((it, i) =>
{
    const g = it.file.split("/")[0]
    if (g !== group) { group = g; const h = document.createElement("h2"); h.textContent = g; list.append(h) }
    const r = document.createElement("div")
    r.className = "row"
    r.innerHTML = `<span class="name">${it.file.split("/")[1].replace(".wav", "")}</span><canvas width="640" height="72"></canvas><span class="ms">${it.ms} ms</span><span class="mark"><button class="g">good</button> <button class="b">bad</button></span>`
    const c = r.querySelector("canvas").getContext("2d")
    c.fillStyle = getComputedStyle(document.body).getPropertyValue("--wave")
    it.peaks.forEach((p, k) => { const h = Math.max(1, p * 70); c.fillRect(k * 4, 36 - h / 2, 3, h) })
    r.onclick = e =>
    {
        if (e.target.classList.contains("g")) mark(i, "good")
        else if (e.target.classList.contains("b")) mark(i, "bad")
        else select(i)
    }
    list.append(r)
    rows.push(r)
})
function play(i) { audio.src = items[i].file; audio.currentTime = 0; audio.play() }
function select(i) { sel = Math.max(0, Math.min(items.length - 1, i)); render(); play(sel); rows[sel].scrollIntoView({ block: "nearest" }) }
function mark(i, m)
{
    marks[items[i].file] = marks[items[i].file] === m ? undefined : m
    try { localStorage.setItem("foley-marks", JSON.stringify(marks)) } catch (e) {}
    render()
}
function render()
{
    rows.forEach((r, i) =>
    {
        r.classList.toggle("sel", i === sel)
        r.classList.toggle("good", marks[items[i].file] === "good")
        r.classList.toggle("bad", marks[items[i].file] === "bad")
    })
    const by = m => items.filter(it => marks[it.file] === m).map(it => it.file)
    const open = items.filter(it => !marks[it.file]).map(it => it.file)
    document.getElementById("out").value = `good: ${by("good").join(" ")}\nbad: ${by("bad").join(" ")}\nunsorted: ${open.join(" ")}`
}
async function playGroup()
{
    const g = items[sel].file.split("/")[0]
    for (let i = 0; i < items.length; i++)
    {
        if (!items[i].file.startsWith(g + "/") || marks[items[i].file] === "bad") continue
        sel = i; render(); play(i)
        await new Promise(res => { audio.onended = res })
        await new Promise(res => setTimeout(res, 250))
    }
    audio.onended = null
}
addEventListener("keydown", e =>
{
    if (e.key === "ArrowDown") select(sel + 1)
    else if (e.key === "ArrowUp") select(sel - 1)
    else if (e.key === " ") play(sel)
    else if (e.key === "g") { mark(sel, "good"); select(sel + 1) }
    else if (e.key === "b") { mark(sel, "bad"); select(sel + 1) }
    else if (e.key === "a") playGroup()
    else return
    e.preventDefault()
})
render()
