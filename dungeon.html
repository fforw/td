<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🏰 ⚔️ 🛡️ dungeon</title>
    <style>
        #ui
        {
            position: absolute;
            left: 8px;
            top: 8px;
            max-width: calc(100vw - 16px);
            box-sizing: border-box;
            padding: 8px;
            background: #000c;
            color: #fff;
            font-family: monospace;
            font-size: 0.8rem;
        }

        #params
        {
            margin: 4px 0;
        }

        #params input[type=number]
        {
            width: 4em;
            margin-right: 0.6em;
        }

        #legend span
        {
            display: inline-block;
            width: 0.8em;
            height: 0.8em;
            margin: 0 0.2em 0 0.6em;
            border: 1px solid #000;
            border-radius: 50%;
            vertical-align: -0.1em;
        }

        #legend span.square
        {
            border-radius: 0;
        }

        #tooltip
        {
            position: absolute;
            padding: 6px 8px;
            background: #000d;
            color: #fff;
            font-family: monospace;
            font-size: 0.8rem;
            white-space: pre;
            pointer-events: none;
        }
    </style>
</head>
<body>
<canvas id="screen">
    <p>
        Your browser has no support for canvas elements.
    </p>
</canvas>
<div id="ui">
    <span id="info"></span>
    <button id="new-seed" type="button">new seed</button>
    <form id="params">
        <input name="seed" type="hidden">
        <label>width <input name="width" type="number" min="1" step="1"></label>
        <label>height <input name="height" type="number" min="1" step="1"></label>
        <label>floor share <input name="floor" type="number" min="0.4" max="1" step="0.05"></label>
        <label>labyrinth <input name="labyrinth" type="number" min="0" step="0.5"></label>
        <button type="submit">update</button>
    </form>
    <div id="legend">
        <span style="background: #40d060"></span>entrance
        <span style="background: #ffd040"></span>main path
        <span style="background: #ff3030"></span>main exit
        <span style="background: #fff; border-style: dashed"></span>far branch
        <span class="square" style="background: #606068"></span>unreachable
        <span class="square" style="background: #ff3030"></span>exit
        <span class="square" style="background: #ffb020"></span>chest
    </div>
</div>
<div id="tooltip" hidden></div>
<div id="footer">
    <a class="same-level" href="dungeon3d.html">in 3D</a>
    <a href="3d.html">3D</a>
    <a href="world.html">world</a>
    <a class="github" href="https://github.com/fforw/td">github</a>
</div>
<script type="module" src="/src/dungeonTest.ts"></script>
</body>
</html>
