<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Treasure &amp; Dread</title>
    <!-- the stylesheets come with the script and follow this, so the display of title.css shows the title once they
         apply, instead of the picture flashing at full size before -->
    <style>
        html { background: #16161d; }
        #title { display: none; }
    </style>
</head>
<body>
<div id="title">
    <div class="logo">
        <img src="media/treasure-and-dread-small.jpg" alt="Treasure &amp; Dread">
        <h2 class="subtitle"></h2>
        <div class="menu">
            <button type="button" class="play">Start</button>
            <button type="button" class="new" title="Another castle">New game</button>
        </div>
    </div>
</div>
<div id="game" hidden></div>
<button id="sound" type="button" title="Music on/off">🔇</button>
<audio src="media/kmacleod-action-strike-162016.mp3" loop preload="none"></audio>
<script type="module" src="/src/index.ts"></script>
</body>
</html>
